version: '3.3'

services:

  microservice-api:
    container_name: 'microservice-api'
    image: "stuartshay/microservice-api:5.0.1-arm.107"
    environment:
     - ASPNETCORE_ENVIRONMENT=Development;
    ports:
     - "5000:5000"
    volumes:
      # Shape files are not in the image; ShapeRootDirectory (../../files from /app) resolves to /files
      - "../files:/files:ro"
    networks:
      - aspnetcoreapp-network

networks:
  aspnetcoreapp-network:

