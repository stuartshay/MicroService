version: '3.3'

services:

  api:
    image: "stuartshay/microservice-api:latest"
    environment:
     - ASPNETCORE_ENVIRONMENT=Docker
    ports:
     - "5000"
    volumes:
      # Shape files are not in the image; ShapeRootDirectory (../../files from /app) resolves to /files
      - "../files:/files:ro"
    networks:
      - microservice-network

  nginx:
    container_name: nginx
    hostname: 'nginx'
    image: nginx:alpine
    ports:
      - "80:8080"
      - '443:8443'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/proxy.conf:/etc/nginx/proxy.conf:ro
      - ./nginx/ssl/localhost.crt:/etc/ssl/certs/localhost.crt:ro
      - ./nginx/ssl/localhost.key:/etc/ssl/certs/localhost.key:ro
      - ./nginx/logs/:/var/log/nginx/
    networks:
      - microservice-network
    restart: always

volumes:
  nginx-log-volume:

networks:
  microservice-network:
