version: '2.0'

services:

  microservice-api:
    container_name: 'microservice-api'
    image: "stuartshay/microservice-api:latest"
    environment:
     - ASPNETCORE_ENVIRONMENT=Development
    ports:
     - "5000:5000"
    volumes:
      # Shape files are not in the image; ShapeRootDirectory (../../files from /app) resolves to /files
      - "../files:/files:ro"
    networks:
      - aspnetcoreapp-network

networks:
  aspnetcoreapp-network:


