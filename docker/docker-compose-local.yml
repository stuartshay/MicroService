version: '3.3'

services:

  api-microservice:
    container_name: 'api-microservice'
    hostname: api-microservice
    image: "stuartshay/microservice-api:latest"
    environment:
     - ASPNETCORE_ENVIRONMENT=Docker
     - ASPNETCORE_URLS=http://*:5002;
    ports:
     - "5002:5002"
    volumes:
      # Shape files are not in the image; ShapeRootDirectory (../../files from /app) resolves to /files
      - "../files:/files:ro"
      - "/home/vagrant/.config/gcloud:/root/.config/gcloud"
    networks:
      - microservice-network

networks:
  microservice-network:

