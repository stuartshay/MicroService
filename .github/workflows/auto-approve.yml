name: Auto Approve

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  checks: read
  contents: read
  pull-requests: write

jobs:
  auto-approve-bot:
    name: Auto Approve Bot PRs
    runs-on: ubuntu-latest
    if: >-
      github.event.pull_request.user.login == 'renovate[bot]' ||
      github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Auto approve PR
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.pulls.createReview({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              event: 'APPROVE'
            });

  auto-approve:
    name: Auto Approve after Copilot Review
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'stuartshay'
    steps:
      - name: Wait for Copilot review
        uses: actions/github-script@v9
        with:
          script: |
            const initialDelayMs = 60000;
            const maxAttempts = 24;
            const delayMs = 10000;
            const prNumber = context.payload.pull_request.number;
            const headSha = context.payload.pull_request.head.sha;

            const hasCopilotCheckSuccessForHead = async () => {
              const { data: checks } = await github.rest.checks.listForRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: headSha,
              });

              return checks.check_runs.some(
                run =>
                  run.name === 'copilot-pull-request-reviewer' &&
                  run.status === 'completed' &&
                  run.conclusion === 'success'
              );
            };

            core.info(`Waiting ${initialDelayMs / 1000}s before the first check — Copilot review consistently takes over a minute to appear`);
            await new Promise(r => setTimeout(r, initialDelayMs));

            for (let i = 0; i < maxAttempts; i++) {
              const { data: reviews } = await github.rest.pulls.listReviews({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
              });

              const copilotReview = reviews
                .filter(r => r.user.login === 'copilot-pull-request-reviewer[bot]' && r.state !== 'DISMISSED' && r.commit_id === headSha)
                .sort((a, b) => new Date(b.submitted_at) - new Date(a.submitted_at))[0];

              if (copilotReview) {
                core.info(`Copilot review found (state: ${copilotReview.state})`);
                return;
              }

              if (await hasCopilotCheckSuccessForHead()) {
                core.info('Copilot check-run succeeded for current head SHA');
                return;
              }

              core.info(`Attempt ${i + 1}/${maxAttempts}: waiting for Copilot review...`);
              await new Promise(r => setTimeout(r, delayMs));
            }

            core.setFailed('Copilot review not found after 5 minutes');

      - name: Log review context
        uses: actions/github-script@v9
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const headSha = context.payload.pull_request.head.sha;

            const hasCopilotCheckSuccessForHead = async () => {
              const { data: checks } = await github.rest.checks.listForRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: headSha,
              });

              return checks.check_runs.some(
                run =>
                  run.name === 'copilot-pull-request-reviewer' &&
                  run.status === 'completed' &&
                  run.conclusion === 'success'
              );
            };

            const { data: reviews } = await github.rest.pulls.listReviews({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });

            const copilotReview = reviews
              .filter(r => r.user.login === 'copilot-pull-request-reviewer[bot]' && r.state !== 'DISMISSED' && r.commit_id === headSha)
              .sort((a, b) => new Date(b.submitted_at) - new Date(a.submitted_at))[0];

            const copilotCheckSuccess = await hasCopilotCheckSuccessForHead();

            if (!copilotReview && !copilotCheckSuccess) {
              core.setFailed('No current-head Copilot review or successful check-run found — cannot log review context');
              return;
            }

            const comments = await github.paginate(github.rest.pulls.listReviewComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });

            const copilotComments = comments.filter(
              c => c.user.login === 'copilot-pull-request-reviewer[bot]'
            );

            core.info(`PR #${prNumber}: ${context.payload.pull_request.title}`);
            core.info(`Head SHA: ${headSha}`);
            if (copilotReview) {
              core.info(`Review by: ${copilotReview.user.login}`);
              core.info(`Review state: ${copilotReview.state}`);
            } else {
              core.info('No current-head review found; using successful Copilot check-run signal');
            }
            core.info(`Copilot inline comments: ${copilotComments.length}`);

            if (copilotComments.length > 0) {
              core.warning(`Copilot left ${copilotComments.length} inline comment(s) — review before merging`);
            }

      - name: Auto approve PR
        uses: actions/github-script@v9
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const headSha = context.payload.pull_request.head.sha;

            const hasCopilotCheckSuccessForHead = async () => {
              const { data: checks } = await github.rest.checks.listForRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: headSha,
              });

              return checks.check_runs.some(
                run =>
                  run.name === 'copilot-pull-request-reviewer' &&
                  run.status === 'completed' &&
                  run.conclusion === 'success'
              );
            };

            const { data: reviews } = await github.rest.pulls.listReviews({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });

            const copilotReview = reviews
              .filter(r => r.user.login === 'copilot-pull-request-reviewer[bot]' && r.state !== 'DISMISSED' && r.commit_id === headSha)
              .sort((a, b) => new Date(b.submitted_at) - new Date(a.submitted_at))[0];

            const copilotCheckSuccess = await hasCopilotCheckSuccessForHead();

            if (!copilotReview && !copilotCheckSuccess) {
              core.setFailed('No current-head Copilot review or successful check-run found — not auto-approving');
              return;
            }

            if (copilotReview && copilotReview.state === 'CHANGES_REQUESTED') {
              core.setFailed(`Copilot requested changes — not auto-approving (state: ${copilotReview.state})`);
              return;
            }

            if (copilotReview) {
              const comments = await github.paginate(github.rest.pulls.listReviewComments, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
              });

              const copilotHeadComments = comments.filter(
                c => c.user.login === 'copilot-pull-request-reviewer[bot]' && c.commit_id === headSha
              );

              if (copilotHeadComments.length > 0) {
                core.setFailed(`Copilot left ${copilotHeadComments.length} inline comment(s) on the current head — not auto-approving`);
                return;
              }
            }

            await github.rest.pulls.createReview({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
              event: 'APPROVE'
            });
