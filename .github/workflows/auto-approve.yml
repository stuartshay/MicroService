name: Auto Approve

# pull_request, not pull_request_target: Renovate's branches are in this repository, so its runs get
# the token this job asks for, and no run ever holds a write token for code from a fork. Dependabot
# runs would get a read-only token, but Renovate owns updates (Dependabot has opened none since 2023).
on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  auto-approve-bot:
    name: Auto Approve Bot PRs
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'renovate[bot]'
    steps:
      - name: Auto approve PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            await github.rest.pulls.createReview({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              event: 'APPROVE'
            });
