name: Build/Test/Deploy
env:
  DOCKER_REPOSITORY: stuartshay/microservice-api
  DOCKER_REPOSITORY_IMAGE: stuartshay/microservice-api
  DOCKER_IMAGE_TAG: 10.0.${{ github.run_number }}
  BUILD_NUMBER: ${{ github.run_number }}
  DOCKER_FILE: docker/microservice-api-multi.dockerfile/Dockerfile
  BRANCH_NAME: '${{ github.ref_name }}'
  GCP_DOCKER_IMAGE: us-east4-docker.pkg.dev/${{ secrets.GCP_PROJECT }}/microservice-api/microservice-api
  ARTIFACT_REGISTRY_HOST: us-east4-docker.pkg.dev
  PROJECT_ID: ${{ secrets.GCP_PROJECT }}
  SERVICE: microservice-api
  REGION: us-east4
  DOCKER_IMAGE_PLATFORM: linux/amd64,linux/arm/v7
  ASPNETCORE_ENVIRONMENT: CloudRun
  ASPNETCORE_URLS: 'http://*:5000'

# Jobs that sign in to Google Cloud add id-token: write (workload identity, no key)
permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'test/**'
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set current_datetime
        id: set_datetime
        run: echo "current_datetime=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Google Auth
        id: 'auth'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
        with:
          project_id: ${{ secrets.GCP_PROJECT }}

      - name: Google Cloud Artifacts/Authorize Docker push
        run: gcloud auth configure-docker ${{ env.ARTIFACT_REGISTRY_HOST }}

      - name: Build image
        id: docker_build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          build-args: |
            BUILD_NUMBER=${{ env.BUILD_NUMBER }}
          file: ${{ env.DOCKER_FILE }}
          tags: |
            ${{ env.DOCKER_REPOSITORY_IMAGE}}:latest
            ${{ env.DOCKER_REPOSITORY_IMAGE }}:${{ env.DOCKER_IMAGE_TAG}}
            ${{ env.GCP_DOCKER_IMAGE }}:${{ env.DOCKER_IMAGE_TAG }}
          labels: |
            org.label-schema.version=10.0.1.${{ env.BUILD_NUMBER }}
            org.label-schema.build-date=${{ steps.set_datetime.outputs.current_datetime }}
          outputs: type=docker,dest=image.tar
          cache-from: type=registry,ref=${{ env.GCP_DOCKER_IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.GCP_DOCKER_IMAGE }}:buildcache,mode=max

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: docker-artifact
          path: image.tar

  publish-dockerhub:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8

      - name: Load images
        run: |
          docker load --input docker-artifact/image.tar

      - name: Login to DockerHub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker Hub
        run: |
          docker push ${{ env.DOCKER_REPOSITORY_IMAGE}} --all-tags

  publish-googlecloud:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    needs: [build]
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8

      - name: Load images
        run: |
          docker load --input docker-artifact/image.tar

      - name: Google Auth
        id: 'auth'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
        with:
          project_id: ${{ secrets.GCP_PROJECT }}

      - name: Google Cloud Artifacts/Authorize Docker push
        run: gcloud auth configure-docker ${{ env.ARTIFACT_REGISTRY_HOST }}

      - name: GCP Artifact Registry
        run: docker push ${{ env.GCP_DOCKER_IMAGE }} --all-tags

  deploy-googlecloud:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    needs: publish-googlecloud
    environment:
      name: prod
      url: ${{ steps.deploy.outputs.url }}
    outputs:
      url: ${{ steps.deploy.outputs.url }}

    steps:
      - name: Google Auth
        id: 'auth'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
        with:
          project_id: ${{ secrets.GCP_PROJECT }}

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@2028e2d7d30a78c6910e0632e48dd561b064884d # v3
        with:
          service: ${{ env.SERVICE }}
          image: ${{ env.GCP_DOCKER_IMAGE }}:${{ env.DOCKER_IMAGE_TAG}}
          region: ${{ env.REGION }}
          env_vars: |
            ASPNETCORE_ENVIRONMENT=${{ env.ASPNETCORE_ENVIRONMENT }}
            ASPNETCORE_URLS=${{ env.ASPNETCORE_URLS }}
          env_vars_update_strategy: 'merge'
          secrets: |
            ConnectionStrings__PostgreSql=postgres_coredatastore:latest
          secrets_update_strategy: 'merge'
          # Public access is a Terraform-managed invoker binding (nyc-landmarks-vector-db
          # infrastructure/github_deploy), so deploys no longer rewrite the service's IAM policy
          flags: '--memory 2Gi --port 5000'

  health-googlecloud:
    name: health check
    runs-on: ubuntu-latest
    needs: deploy-googlecloud
    env:
      HEALTH_URL: ${{ needs['deploy-googlecloud'].outputs.url }}/health
      MAX_ATTEMPTS: 15
      RETRY_DELAY_SECONDS: 5
      CONNECT_TIMEOUT_SECONDS: 10
      REQUEST_TIMEOUT_SECONDS: 30
    steps:
      - run: |
          set -euo pipefail

          if [[ "${HEALTH_URL}" == "/health" ]]; then
            echo "Cloud Run deployment URL was not provided" >&2
            exit 1
          fi

          response="$(curl \
            --fail \
            --show-error \
            --silent \
            --location \
            --connect-timeout "${CONNECT_TIMEOUT_SECONDS}" \
            --max-time "${REQUEST_TIMEOUT_SECONDS}" \
            --retry "${MAX_ATTEMPTS}" \
            --retry-delay "${RETRY_DELAY_SECONDS}" \
            --retry-connrefused \
            "${HEALTH_URL}")"

          if [[ "${response}" != "Healthy" ]]; then
            echo "Unexpected health response: ${response}" >&2
            exit 1
          fi

          echo "Deployment health check passed: ${HEALTH_URL}"

  cleanup:
    runs-on: ubuntu-latest
    # Deleting the build artifact needs actions: write (the workflow default is contents: read)
    permissions:
      actions: write
    needs: [health-googlecloud]
    steps:
      - uses: geekyeggo/delete-artifact@176a747ab7e287e3ff4787bf8a148716375ca118 # v6
        with:
          name: docker-artifact
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
