name: CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install pre-commit
        run: python -m pip install --disable-pip-version-check pre-commit==4.6.0

      - name: Install actionlint
        run: |
          curl --fail --location --retry 3 --silent --show-error \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output actionlint.tar.gz
          tar -xzf actionlint.tar.gz actionlint
          rm -f actionlint.tar.gz
          echo "$PWD" >> "$GITHUB_PATH"

      - name: Install gitleaks
        run: |
          curl --fail --location --retry 3 --silent --show-error \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          rm -f gitleaks.tar.gz
          echo "$PWD" >> "$GITHUB_PATH"

      - name: Scan new commits for secrets
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -z "${BASE_SHA}" || "${BASE_SHA}" =~ ^0+$ ]]; then
            echo "No base commit available (e.g. first push to a new branch); scanning full history instead."
            gitleaks git --redact --verbose --no-banner
          else
            gitleaks git --redact --verbose --no-banner --log-opts="${BASE_SHA}..HEAD"
          fi

      - name: Run pre-commit
        run: pre-commit run --all-files --show-diff-on-failure

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore dependencies
        run: dotnet restore MicroService.sln

      - name: Build solution
        run: dotnet build MicroService.sln --configuration Release --no-restore

  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Run analyzer validation
        run: make analyze

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Prepare test data
        run: |
          unzip -p \
            'files/LPC_Individual_Landmark_and_Historic_Building_Database/20231209/Individual Landmark and Historic District Building Database_20240211.zip' \
            'geo_export_590d5a7b-ac38-4625-a642-55d90456869d.dbf' \
            > 'files/LPC_Individual_Landmark_and_Historic_Building_Database/LPC_Individual_Landmark_and_Historic_District_Building_Database_20231209.dbf'

      - name: Test solution
        run: dotnet test MicroService.sln --configuration Release
