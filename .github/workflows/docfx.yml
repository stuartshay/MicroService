name: Deploy DocFX to GitHub Pages

on:
  workflow_dispatch:
  push:
    paths:
      - 'docfx/**'
    branches:
      - master

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # peaceiris/actions-gh-pages pushes the built site to the gh-pages branch
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.x

      - name: Install DocFX
        run: dotnet tool install --global docfx

      - name: Install Swashbuckle CLI
        run: dotnet tool install --global Swashbuckle.AspNetCore.Cli

      - name: Build project
        run: dotnet build --configuration Release

      #- name: Generate OpenAPI JSON
      #  run: swagger tofile --output docfx/restapi/swagger.json MicroService/src/MicroService.WebApi/MicroService.WebApi.csproj v1

      - name: Build DocFX
        run: ~/.dotnet/tools/docfx build docfx/docfx.json

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docfx/_site
